<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- HEART 3D GRADIENT -->
    <radialGradient id="heart-glow" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF8DA1"/>
      <stop offset="45%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#D81159"/>
    </radialGradient>

    <!-- WINGS GRADIENT -->
    <linearGradient id="wing-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>

    <radialGradient id="heart-blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA8C5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFA8C5" stop-opacity="0"/>
    </radialGradient>

    <filter id="heart-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#E11D48" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#heart-shadow)">
    <!-- CUTE ANGEL / FAIRY WINGS ON SIDES -->
    <!-- Left Wing -->
    <g transform="translate(10, 36)">
      <path d="M26 28 C16 28 6 22 2 12 C-1 4 4 0 12 2 C18 4 22 10 26 18 Z" fill="url(#wing-grad)"/>
      <path d="M26 30 C18 34 8 32 4 24 C2 18 6 16 12 18 C18 20 22 24 26 28 Z" fill="#FDF2F8"/>
    </g>
    <!-- Right Wing -->
    <g transform="translate(84, 36)">
      <path d="M0 28 C10 28 20 22 24 12 C27 4 22 0 14 2 C8 4 4 10 0 18 Z" fill="url(#wing-grad)"/>
      <path d="M0 30 C8 34 18 32 22 24 C24 18 20 16 14 18 C8 20 4 24 0 28 Z" fill="#FDF2F8"/>
    </g>

    <!-- MAIN PLUMP 3D GLOSSY HEART -->
    <path d="M60 96 C40 82 18 64 18 42 C18 26 30 16 44 16 C51 16 57 20 60 25 C63 20 69 16 76 16 C90 16 102 26 102 42 C102 64 80 82 60 96 Z" fill="url(#heart-glow)"/>

    <!-- GLOSSY SPECULAR HIGHLIGHTS -->
    <!-- Left lobe reflection -->
    <ellipse cx="36" cy="28" rx="7" ry="12" transform="rotate(-30 36 28)" fill="#FFFFFF" opacity="0.65"/>
    <circle cx="28" cy="42" r="3" fill="#FFFFFF" opacity="0.5"/>
    <!-- Right lobe mini gleam -->
    <ellipse cx="80" cy="27" rx="4" ry="7" transform="rotate(25 80 27)" fill="#FFFFFF" opacity="0.45"/>

    <!-- SWEET LOVING FACE -->
    <!-- Joyful Closed Eyes (Happy crescents ^_^) -->
    <path d="M42 46 Q47 40 52 46" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M68 46 Q73 40 78 46" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none"/>

    <!-- Cute Blush Cheeks -->
    <circle cx="38" cy="54" r="6" fill="url(#heart-blush)"/>
    <circle cx="82" cy="54" r="6" fill="url(#heart-blush)"/>

    <!-- Sweet Smiling Mouth -->
    <path d="M54 53 Q60 60 66 53" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <!-- Cute Heart Tongue -->
    <path d="M57 56 Q60 61 63 56 Z" fill="#FFE4E6"/>

    <!-- FLOATING GOLDEN LOVE SPARKLES & MINI HEARTS -->
    <!-- Big Gold Sparkle -->
    <path d="M88 18 L90 11 L92 18 L99 20 L92 22 L90 29 L88 22 L81 20 Z" fill="#FDE047"/>
    <!-- Left Mini Gold Sparkle -->
    <path d="M18 26 L19.5 21 L21 26 L26 27.5 L21 29 L19.5 34 L18 29 L13 27.5 Z" fill="#FDE047"/>
    
    <!-- Mini Floating Heart (Top Left) -->
    <g transform="translate(24, 6) scale(0.65)">
      <path d="M12 18 C8 15 4 11 4 7 C4 4 6 2 9 2 C11 2 12 3 12 4 C12 3 13 2 15 2 C18 2 20 4 20 7 C20 11 16 15 12 18 Z" fill="#FF6584"/>
    </g>
    <!-- Mini Floating Heart (Bottom Right) -->
    <g transform="translate(90, 68) scale(0.6)">
      <path d="M12 18 C8 15 4 11 4 7 C4 4 6 2 9 2 C11 2 12 3 12 4 C12 3 13 2 15 2 C18 2 20 4 20 7 C20 11 16 15 12 18 Z" fill="#FF8BA7"/>
    </g>

    <!-- Sparkle Dots -->
    <circle cx="70" cy="8" r="2" fill="#FDE047"/>
    <circle cx="106" cy="46" r="2.2" fill="#FDE047"/>
    <circle cx="16" cy="62" r="1.8" fill="#FFFFFF"/>
  </g>
</svg>
