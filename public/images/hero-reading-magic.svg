<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- GLOW GRADIENTS -->
    <radialGradient id="book-light-glow" cx="50%" cy="80%" r="75%">
      <stop offset="0%" stop-color="#FFF9A6" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#FF9E00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="magic-ray" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFF480" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </linearGradient>

    <!-- BOY GRADIENTS -->
    <linearGradient id="boy-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0BD"/>
      <stop offset="100%" stop-color="#FFCD9B"/>
    </linearGradient>
    <linearGradient id="boy-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6A3B18"/>
      <stop offset="100%" stop-color="#452309"/>
    </linearGradient>
    <linearGradient id="boy-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4EA8DE"/>
      <stop offset="100%" stop-color="#2176FF"/>
    </linearGradient>

    <!-- FOX GRADIENTS -->
    <linearGradient id="fox-fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8C38"/>
      <stop offset="100%" stop-color="#E85D04"/>
    </linearGradient>
    <linearGradient id="fox-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE8D6"/>
    </linearGradient>

    <!-- BOOK GRADIENTS -->
    <linearGradient id="book-pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF5E4"/>
    </linearGradient>
    <linearGradient id="book-cover-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <filter id="magic-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- BACKGROUND MAGIC LIGHT RAYS -->
  <g>
    <!-- Giant Warm Radial Glow behind Book -->
    <ellipse cx="250" cy="270" rx="190" ry="120" fill="url(#book-light-glow)"/>
    <!-- Upward Light Beams -->
    <polygon points="250,260 160,80 200,70" fill="url(#magic-ray)"/>
    <polygon points="250,260 230,50 270,50" fill="url(#magic-ray)"/>
    <polygon points="250,260 300,70 340,80" fill="url(#magic-ray)"/>
    <polygon points="250,260 100,140 130,120" fill="url(#magic-ray)"/>
    <polygon points="250,260 370,120 400,140" fill="url(#magic-ray)"/>
  </g>

  <!-- BOY (LEFT-CENTER) -->
  <g id="boy">
    <!-- Boy Body / Shirt -->
    <path d="M190 200 C175 200 160 215 155 235 L150 275 C180 285 240 285 270 275 L265 235 C260 215 245 200 230 200 Z" fill="url(#boy-shirt)"/>
    <!-- Shirt Collar / Neck -->
    <path d="M198 200 Q210 210 222 200" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    <rect x="204" y="185" width="12" height="18" fill="url(#boy-skin)" rx="4"/>

    <!-- Boy Arms leaning on table/book -->
    <!-- Left Arm -->
    <path d="M160 225 Q175 250 195 258" stroke="url(#boy-shirt)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="195" cy="258" r="8" fill="url(#boy-skin)"/>
    <!-- Right Arm -->
    <path d="M260 225 Q245 250 225 258" stroke="url(#boy-shirt)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="225" cy="258" r="8" fill="url(#boy-skin)"/>

    <!-- Boy Head -->
    <ellipse cx="210" cy="145" rx="34" ry="36" fill="url(#boy-skin)"/>

    <!-- Boy Ears -->
    <ellipse cx="176" cy="148" rx="6" ry="8" fill="url(#boy-skin)"/>
    <ellipse cx="177" cy="148" rx="3.5" ry="5" fill="#FFAAA6"/>
    <ellipse cx="244" cy="148" rx="6" ry="8" fill="url(#boy-skin)"/>
    <ellipse cx="243" cy="148" rx="3.5" ry="5" fill="#FFAAA6"/>

    <!-- Boy Hair (Fluffy, cute cartoon bangs) -->
    <path d="M174 135 C170 100 190 85 220 85 C250 85 256 105 252 135 C246 125 240 120 232 124 C225 115 215 115 206 124 C198 116 186 118 180 128 C176 130 174 135 174 135 Z" fill="url(#boy-hair)"/>

    <!-- Cute Big Cartoon Eyes (Joyful & looking down at book) -->
    <!-- Left Eye -->
    <ellipse cx="196" cy="146" rx="5" ry="6.5" fill="#2C1810"/>
    <circle cx="194.5" cy="144" r="2.2" fill="#FFFFFF"/>
    <circle cx="197.5" cy="148" r="1.2" fill="#FFFFFF"/>
    <!-- Right Eye -->
    <ellipse cx="224" cy="146" rx="5" ry="6.5" fill="#2C1810"/>
    <circle cx="222.5" cy="144" r="2.2" fill="#FFFFFF"/>
    <circle cx="225.5" cy="148" r="1.2" fill="#FFFFFF"/>

    <!-- Eyebrows (happy raised curves) -->
    <path d="M190 134 Q196 130 202 134" stroke="#452309" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M218 134 Q224 130 230 134" stroke="#452309" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="188" cy="155" rx="6" ry="4" fill="#FF8484" opacity="0.65"/>
    <ellipse cx="232" cy="155" rx="6" ry="4" fill="#FF8484" opacity="0.65"/>

    <!-- Cute Nose -->
    <circle cx="210" cy="151" r="2" fill="#E08365"/>

    <!-- Happy Open Smile (Laughing with delight!) -->
    <path d="M202 158 Q210 169 218 158 Z" fill="#991B1B"/>
    <path d="M205 162 Q210 168 215 162 Z" fill="#FF8DA1"/>
  </g>

  <!-- LITTLE FOX (RIGHT-CENTER) -->
  <g id="fox">
    <!-- Fluffy Fox Tail (Swirling to the right) -->
    <g transform="translate(350, 180) rotate(-15)">
      <path d="M0 40 C30 20 60 40 70 70 C75 95 55 120 30 115 C0 110 -20 80 0 40 Z" fill="url(#fox-fur)"/>
      <!-- White Tail Tip -->
      <path d="M50 85 C65 92 68 102 52 110 C40 114 30 115 30 115 C55 120 75 95 70 70 C65 78 55 82 50 85 Z" fill="url(#fox-white)"/>
    </g>

    <!-- Fox Body (Sitting attentively) -->
    <path d="M285 205 C275 215 270 235 275 265 C285 272 325 272 335 265 C340 235 330 215 315 205 Z" fill="url(#fox-fur)"/>
    <!-- White Chest Bib -->
    <path d="M293 212 C288 225 292 255 305 264 C318 255 322 225 317 212 Q305 218 293 212 Z" fill="url(#fox-white)"/>

    <!-- Cute Front Paws resting by book -->
    <ellipse cx="288" cy="265" rx="6" ry="5" fill="url(#fox-white)"/>
    <ellipse cx="320" cy="265" rx="6" ry="5" fill="url(#fox-white)"/>

    <!-- Fox Head -->
    <path d="M305 150 C280 150 270 170 275 190 C280 208 305 215 305 215 C305 215 330 208 335 190 C340 170 330 150 305 150 Z" fill="url(#fox-fur)"/>
    <!-- White Fox Cheeks & Muzzle -->
    <path d="M275 186 C282 202 298 212 305 214 C312 212 328 202 335 186 C325 182 315 186 305 178 C295 186 285 182 275 186 Z" fill="url(#fox-white)"/>

    <!-- Fox Ears (Pointy with dark tips) -->
    <!-- Left Ear -->
    <polygon points="280,155 268,115 295,138" fill="url(#fox-fur)"/>
    <polygon points="278,148 272,122 290,138" fill="#4A1805"/>
    <polygon points="280,146 276,128 288,140" fill="#FFE8D6"/>
    <!-- Right Ear -->
    <polygon points="330,155 342,115 315,138" fill="url(#fox-fur)"/>
    <polygon points="332,148 338,122 320,138" fill="#4A1805"/>
    <polygon points="330,146 334,128 322,140" fill="#FFE8D6"/>

    <!-- Fox Eyes (Curious, sparkling, looking at book) -->
    <ellipse cx="292" cy="174" rx="4.5" ry="5.5" fill="#2C1810"/>
    <circle cx="290.5" cy="172" r="2" fill="#FFFFFF"/>
    <circle cx="293.5" cy="175" r="1" fill="#FFFFFF"/>

    <ellipse cx="318" cy="174" rx="4.5" ry="5.5" fill="#2C1810"/>
    <circle cx="316.5" cy="172" r="2" fill="#FFFFFF"/>
    <circle cx="319.5" cy="175" r="1" fill="#FFFFFF"/>

    <!-- Fox Nose & Smile -->
    <path d="M302 186 L308 186 L305 190 Z" fill="#2C1810"/>
    <path d="M302 191 Q305 194 308 191" stroke="#2C1810" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Rosy Cheeks -->
    <circle cx="282" cy="184" r="4.5" fill="#FF8484" opacity="0.6"/>
    <circle cx="328" cy="184" r="4.5" fill="#FF8484" opacity="0.6"/>
  </g>

  <!-- GIANT OPEN GLOWING STORYBOOK (FOREGROUND) -->
  <g id="open-book">
    <!-- Book Shadow underneath -->
    <ellipse cx="250" cy="305" rx="175" ry="16" fill="#0F172A" opacity="0.35"/>

    <!-- Blue Hardcover Base (Sticking out under pages) -->
    <path d="M80 292 C150 285 240 292 250 298 C260 292 350 285 420 292 L425 284 C355 277 262 284 250 290 C238 284 145 277 75 284 Z" fill="url(#book-cover-blue)"/>
    <path d="M75 284 C145 277 238 284 250 290 C262 284 355 277 425 284 L422 280 C352 273 262 280 250 286 C238 280 148 273 78 280 Z" fill="#D97706"/>

    <!-- Left Page Wing (Layered 3D curvature) -->
    <path d="M82 280 C145 265 235 275 250 286 L250 245 C235 235 145 225 86 240 Z" fill="#E2E8F0"/>
    <path d="M84 278 C145 264 235 274 250 284 L250 243 C235 233 145 223 88 238 Z" fill="url(#book-pages)"/>

    <!-- Right Page Wing (Layered 3D curvature) -->
    <path d="M418 280 C355 265 265 275 250 286 L250 245 C265 235 355 225 414 240 Z" fill="#E2E8F0"/>
    <path d="M416 278 C355 264 265 274 250 284 L250 243 C265 233 355 223 412 238 Z" fill="url(#book-pages)"/>

    <!-- Page Content Highlights (Tiny colorful illustration outlines on open pages) -->
    <!-- Left page illustration: Rainbow & Star -->
    <path d="M125 258 Q145 248 165 256" stroke="#FB7185" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M130 262 Q145 253 160 260" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M135 266 Q145 258 155 264" stroke="#34D399" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- Right page illustration: Castle & Stars -->
    <path d="M340 265 L340 250 L350 244 L360 250 L360 265 Z" fill="#818CF8" opacity="0.7"/>
    <polygon points="350,240 353,246 360,247 355,251 357,258 350,254 343,258 345,251 340,247 347,246" fill="#FDE047" opacity="0.85"/>

    <!-- Book Spine Center Fold Glowing Highlight -->
    <path d="M248 245 Q250 265 250 286 Q250 265 252 245 Z" fill="#F59E0B" opacity="0.6"/>

    <!-- Golden Intense Core Light Emitter from Spine -->
    <ellipse cx="250" cy="258" rx="35" ry="14" fill="#FFFFFF" filter="url(#magic-blur)"/>
    <ellipse cx="250" cy="258" rx="20" ry="8" fill="#FFF9A6"/>
  </g>

  <!-- FLOATING SPARKLES, HEARTS & STARS RISING FROM BOOK -->
  <g id="sparkles">
    <!-- Star 1 -->
    <path d="M248 110 L251 98 L254 110 L266 113 L254 116 L251 128 L248 116 L236 113 Z" fill="#FFE500"/>
    <!-- Star 2 -->
    <path d="M150 170 L152 160 L154 170 L164 172 L154 174 L152 184 L150 174 L140 172 Z" fill="#FFD000"/>
    <!-- Star 3 -->
    <path d="M350 110 L351.5 102 L353 110 L361 111.5 L353 113 L351.5 121 L350 113 L342 111.5 Z" fill="#FF69B4"/>
    <!-- Star 4 -->
    <path d="M120 100 L121.5 93 L123 100 L130 101.5 L123 103 L121.5 110 L120 103 L113 101.5 Z" fill="#38BDF8"/>
    <!-- Star 5 -->
    <path d="M380 180 L381.5 173 L383 180 L390 181.5 L383 183 L381.5 190 L380 183 L373 181.5 Z" fill="#FBBF24"/>

    <!-- Floating Mini Hearts -->
    <path d="M280 120 C277 116 272 116 270 120 C268 124 275 130 275 130 C275 130 282 124 280 120 Z" fill="#FF5376" transform="scale(1.4) translate(-75, -25)"/>
    <path d="M180 80 C177 76 172 76 170 80 C168 84 175 90 175 90 C175 90 182 84 180 80 Z" fill="#C084FC" transform="scale(1.2) translate(-40, 10)"/>

    <!-- Glowing circular dots -->
    <circle cx="210" cy="180" r="3" fill="#FFF580"/>
    <circle cx="290" cy="185" r="2.5" fill="#FFF580"/>
    <circle cx="170" cy="130" r="2" fill="#FFFFFF"/>
    <circle cx="330" cy="90" r="2.5" fill="#FFFFFF"/>
    <circle cx="270" cy="70" r="3.5" fill="#FFD700"/>
    <circle cx="230" cy="85" r="2" fill="#F472B6"/>
  </g>
</svg>
